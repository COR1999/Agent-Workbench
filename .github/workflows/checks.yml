name: checks

# Runs the repository's existing guard scripts on every push and PR to main.
# This is deliberately not a "CI platform" — it is the gate that makes the
# guards non-optional. A guard that depends on someone remembering to run it
# is a wish, not a gate (see issue: "No CI/CD pipeline").

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: skill invariants
        run: bash tests/skill-invariants.sh

      - name: import contract (adopt/unadopt, incl. legacy marker migration)
        run: bash tests/import-migration.sh

      # Unguarded on purpose. This step used to be wrapped in "if the script
      # exists", from when it had not landed on main yet. That guard outlived its
      # reason and became a way for the check to silently not run: rename or
      # delete the script and CI would report success. A gate that can pass by
      # being absent is not a gate.
      - name: public-tree preflight (no client identifiers)
        run: bash scripts/preflight-public.sh
